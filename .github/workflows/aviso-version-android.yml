# Aviso automático cuando Google Play publica una versión nueva de Ale Guitarra.
#
# Mira qué versión muestra Google Play (GitHub lo corre cada 30 minutos en
# teoría; en la práctica, a veces cada varias horas). Cuando aparece una
# nueva, espera 2 horas DENTRO de la misma ejecución (lo que tarda Google en
# habilitar la actualización dentro de la app) y manda UNA notificación a
# todos los celulares. Al tocarla se abre la app y aparece el cartel de
# actualización de Play. Desde "Run workflow" se puede mandar ya, sin esperar.
#
# Necesita el secreto ADMIN_PASSWORD (la misma contraseña de administrador de
# la app): Settings > Secrets and variables > Actions > New repository secret.
#
# Archivos de estado (no tocar a mano salvo para corregir):
#   .github/play-version.txt    última versión que ya se avisó
#   .github/play-detectada.txt  versión nueva vista y cuándo (espera las 2 h)
name: Aviso de versión nueva en Google Play

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      probar:
        description: 'Solo mostrar qué haría, sin mandar la notificación'
        type: boolean
        default: true
      mandar_ya:
        description: 'Si hay una versión nueva, mandar el aviso ya (sin esperar las 2 horas)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aviso-version-android
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Revisar Google Play y avisar
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PROBAR: ${{ github.event_name == 'workflow_dispatch' && inputs.probar }}
          MANDAR_YA: ${{ github.event_name == 'workflow_dispatch' && inputs.mandar_ya }}
          ANON: sb_publishable_6_QGimLMb1AXk2nmu7_TKQ_tfWxvsVB
          ESPERA_HORAS: '2'
        run: |
          set -euo pipefail
          guardar() {
            git config user.name "aviso-automatico"
            git config user.email "actions@users.noreply.github.com"
            git add .github/play-version.txt .github/play-detectada.txt 2>/dev/null || true
            git commit -m "$1" && { git pull -q --rebase origin main || true; git push; }
          }

          # En modo prueba se comprueba que la contraseña esté bien SIN mandar
          # nada: el servidor revisa la contraseña antes que el texto, así que
          # un aviso sin título responde "Falta el título" si la contraseña es
          # correcta, o "Contraseña incorrecta" si no.
          if [ "$PROBAR" = "true" ]; then
            if [ -z "${ADMIN_PASSWORD:-}" ]; then
              echo "CONTRASEÑA: falta cargar el secreto ADMIN_PASSWORD."
            else
              datos=$(jq -n --arg p "$ADMIN_PASSWORD" '{password: $p, title: "", body: "", type: "home"}')
              r=$(curl -s --max-time 30 -X POST -H "Content-Type: application/json" -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -d "$datos" "https://ntrfkgxqeugjshvicgfj.supabase.co/functions/v1/send-push")
              case "$r" in
                *"Falta el t"*) echo "CONTRASEÑA: correcta ✓ (no se mandó nada)";;
                *"incorrecta"*) echo "CONTRASEÑA: INCORRECTA ✗ — revisá el secreto ADMIN_PASSWORD"; exit 1;;
                *) echo "CONTRASEÑA: no se pudo comprobar: $r";;
              esac
            fi
          fi

          html=$(curl -sL --max-time 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" \
            "https://play.google.com/store/apps/details?id=com.corapps.aleguitarra&hl=es&gl=UY" || true)
          nueva=$(printf '%s' "$html" | grep -o '\[\[\["[0-9]\+\.[0-9]\+\.[0-9]\+"\]\]' | head -1 | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' || true)
          avisada=$(cat .github/play-version.txt 2>/dev/null || echo 0.0.0)
          echo "Google Play muestra: ${nueva:-(no se pudo leer)} — última avisada: $avisada"
          [ -n "$nueva" ] || { echo "No se pudo leer la versión: se prueba en la próxima vuelta."; exit 0; }

          mayor=$(printf '%s\n%s\n' "$avisada" "$nueva" | sort -V | tail -1)
          if [ "$nueva" = "$avisada" ] || [ "$mayor" != "$nueva" ]; then echo "Nada nuevo."; exit 0; fi

          ahora=$(date +%s)
          read -r det_ver det_cuando < .github/play-detectada.txt 2>/dev/null || true
          if [ "${det_ver:-}" != "$nueva" ]; then
            echo "Versión nueva $nueva: se avisa en $ESPERA_HORAS horas."
            [ "$PROBAR" = "true" ] && { echo "PRUEBA: no se guarda nada."; exit 0; }
            echo "$nueva $ahora" > .github/play-detectada.txt
            guardar "Google Play publicó la $nueva: aviso en $ESPERA_HORAS horas"
            det_cuando=$ahora
          fi
          faltan=$(( det_cuando + ESPERA_HORAS * 3600 - ahora ))
          if [ "$faltan" -gt 0 ] && [ "$MANDAR_YA" != "true" ]; then
            if [ "$PROBAR" = "true" ]; then echo "PRUEBA: faltan $((faltan / 60)) minutos para avisar la $nueva."; exit 0; fi
            # GitHub no corre esto cada 30 minutos de verdad (a veces pasan
            # horas): se espera acá mismo y se manda a la hora justa.
            echo "Espero $((faltan / 60)) minutos y mando el aviso de la $nueva."
            sleep "$faltan"
          fi

          if [ "$PROBAR" = "true" ]; then echo "PRUEBA: ahora mandaría el aviso de la $nueva."; exit 0; fi
          [ -n "${ADMIN_PASSWORD:-}" ] || { echo "Falta el secreto ADMIN_PASSWORD."; exit 1; }

          cuerpo=$(jq -n --arg p "$ADMIN_PASSWORD" '{
            password: $p,
            title: "🎸 Nueva versión de Ale Guitarra",
            body: "Ya está disponible la nueva versión. Tocá para actualizar.",
            type: "home"
          }')
          codigo=$(curl -s -o respuesta.txt -w '%{http_code}' --max-time 60 -X POST \
            "https://ntrfkgxqeugjshvicgfj.supabase.co/functions/v1/send-push" \
            -H "Content-Type: application/json" -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -d "$cuerpo")
          echo "Respuesta ($codigo): $(cat respuesta.txt)"
          [ "$codigo" = "200" ] || { echo "No se pudo mandar: se reintenta en la próxima vuelta."; exit 1; }

          echo "$nueva" > .github/play-version.txt
          rm -f .github/play-detectada.txt
          git rm -q --cached .github/play-detectada.txt 2>/dev/null || true
          guardar "Aviso enviado: versión $nueva en Google Play"

      # El cartel de iOS se activa solo, con el mismo texto de siempre, cuando
      # la versión nueva ya salió en Google Play (y avisó) y también está en el
      # App Store. Pone "latest_ios_version" (la app compara la versión) y deja
      # "latest_ios_build" en 243 o más para las apps viejas (1.7.1 y antes),
      # que comparan el número de compilación.
      #   .github/ios-version.txt  versión para la que ya se activó el cartel
      - name: Activar el cartel de iOS
        if: always()
        env:
          PROBAR: ${{ github.event_name == 'workflow_dispatch' && inputs.probar }}
        run: |
          set -euo pipefail
          git pull -q --rebase origin main || true
          ios=$(curl -s --max-time 30 "https://itunes.apple.com/lookup?bundleId=com.corapps.aleguitarra&country=uy" | jq -r '.results[0].version // empty' || true)
          hecha=$(cat .github/ios-version.txt 2>/dev/null || echo 0.0.0)
          avisada=$(cat .github/play-version.txt 2>/dev/null || echo 0.0.0)
          echo "App Store: ${ios:-(no se pudo leer)} — cartel de iOS activado para: $hecha — Google Play ya avisada: $avisada"
          [ -n "$ios" ] || exit 0
          mayor() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          editar() {
            build=$(jq -r '.latest_ios_build // "0"' version-ios.json)
            [ "$build" -ge 243 ] 2>/dev/null || build=243
            jq --arg v "$1" --arg b "$build" '.latest_ios_version = $v | .latest_ios_build = $b | .mandatory = false
              | .message = "¡Nueva versión de Ale Guitarra!\n\nYa está disponible la nueva versión.\n\n¿Querés actualizarla ahora?"' \
              version-ios.json
          }
          if ! mayor "$ios" "$hecha"; then
            echo "Cartel de iOS al día."
            # En prueba se muestra cómo quedaría el archivo en la próxima versión
            # (así se comprueba que la edición anda), sin guardar nada.
            if [ "$PROBAR" = "true" ]; then echo "PRUEBA: así quedaría version-ios.json (no se guarda):"; editar "x.y.z"; fi
            exit 0
          fi
          if mayor "$ios" "$avisada"; then echo "La $ios ya está en el App Store: el cartel se activa cuando salga en Google Play."; exit 0; fi
          if [ "$PROBAR" = "true" ]; then echo "PRUEBA: activaría el cartel de iOS para la $ios:"; editar "$ios"; exit 0; fi
          editar "$ios" > version-ios.tmp && mv version-ios.tmp version-ios.json
          echo "$ios" > .github/ios-version.txt
          git config user.name "aviso-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add version-ios.json .github/ios-version.txt
          git commit -m "iOS: cartel de actualización a la $ios (automático)" && git push
